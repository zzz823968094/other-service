# docker-compose.yml
# Docker日志查询服务 - Docker Compose配置
# 使用 host 网络模式，容器直接共享宿主机网络栈

services:
  docker-log:
    build: .
    container_name: docker-log-service
    network_mode: host
    volumes:
      # 挂载Docker Socket以访问Docker API
      - /var/run/docker.sock:/var/run/docker.sock
      # 挂载日志目录
      - ./logs:/app/logs
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Asia/Shanghai
    restart: unless-stopped

